events { worker_connections 1024; }

http {
    # Define the backend microservices using Docker's internal DNS names
    upstream post_service {
        server post-server:8080;
    }

    upstream comment_service {
        server comment-server:8082;
    }

    server {
        listen 80;
        server_name localhost;

        # Global CORS configuration to trust your Angular frontend running on port 4200
        add_header 'Access-Control-Allow-Origin' 'http://localhost:4200' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;

        # Handle CORS preflight Pre-requests smoothly
        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # Route all traffic matching /api/posts to the Java backend
        location /api/posts {
            proxy_pass http://post_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Route all traffic matching /api/comments to the Go backend
        location /api/comments {
            proxy_pass http://comment_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}