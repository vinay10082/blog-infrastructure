version: '3.8'

services:
  # The API Gateway Front Door
  api-gateway:
    image: nginx:latest
    container_name: blog-api-gateway
    ports:
      - "${API_GATEWAY_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - post-server
      - comment-server
    networks:
      - blog-network

  # The Java Microservice
  post-server:
    build:
      context: ../blog-post-server
    container_name: blog-post-server
    ports:
      - "${POST_SERVER_PORT:-8081}:${POST_SERVER_PORT:-8081}"
    environment:
      - SERVER_PORT=${POST_SERVER_PORT:-8081}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/blog_db
      - SPRING_DATASOURCE_USERNAME=blog_user
      - SPRING_DATASOURCE_PASSWORD=blog_password
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - blog-network

  # The Go Microservice
  comment-server:
    build:
      context: ../blog-comment-server
    container_name: blog-comment-server
    ports:
      - "${COMMENT_SERVER_PORT:-8082}:${COMMENT_SERVER_PORT:-8082}"
    environment:
      - PORT=${COMMENT_SERVER_PORT:-8082}
      - DATABASE_URL=postgres://blog_user:blog_password@postgres:5432/blog_db?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - blog-network

  # The Database
  postgres:
    image: postgres:15-alpine
    container_name: blog-postgres
    environment:
      - POSTGRES_DB=blog_db
      - POSTGRES_USER=blog_user
      - POSTGRES_PASSWORD=blog_password
    ports:
      - "5432:5432"
    networks:
      - blog-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blog_user -d blog_db"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  blog-network:
    driver: bridge