version: '3.8'

services:
  # The API Gateway Front Door
  api-gateway:
    image: nginx:latest
    container_name: blog-api-gateway
    ports:
      - "${API_GATEWAY_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - post-server
      - comment-server
    networks:
      - blog-network

  # The Java Microservice
  post-server:
    build:
      context: ../blog-post-server
    container_name: blog-post-server
    ports:
      - "${POST_SERVER_PORT:-8081}:${POST_SERVER_PORT:-8081}"
    environment:
      - SERVER_PORT=${POST_SERVER_PORT:-8081}
    networks:
      - blog-network

  # The Go Microservice
  comment-server:
    build:
      context: ../blog-comment-server
    container_name: blog-comment-server
    ports:
      - "${COMMENT_SERVER_PORT:-8082}:${COMMENT_SERVER_PORT:-8082}"
    environment:
      - PORT=${COMMENT_SERVER_PORT:-8082}
    networks:
      - blog-network

networks:
  blog-network:
    driver: bridge